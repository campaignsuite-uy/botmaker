# Pruebas automáticas en cada push y en cada pull request: las mismas que exige CampaignSuite para integrar.
# Tipos, pruebas unitarias (en los tres modos), base (PGlite), pantallas, build de la app y uso en el celular.
# No usa ninguna clave: la demo en memoria y el motor simulado alcanzan.
name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Toma la versión de pnpm de "packageManager" en package.json.
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas unitarias
        run: pnpm test
      - name: Pruebas unitarias como en Vercel (demo online)
        run: pnpm test
        env: { VERCEL: '1', CAMPAIGNSUITE_DATOS: demo, CAMPAIGNSUITE_SOLO_LECTURA: '1' }
      - name: Pruebas unitarias como en Vercel (con Supabase)
        run: pnpm test
        env: { VERCEL: '1', CAMPAIGNSUITE_DATOS: supabase }
      - name: Base de datos (migraciones, matriz y reglas por fila, con PGlite)
        run: pnpm db:probar
      # Ninguna prueba puede depender del día en que corre (el 2/10/2026 fallaron dos que mezclaban una fecha fija con el
      # reloj real). Se corren las unitarias y las de base con la fecha corrida 45 días.
      - name: Unitarias y base con la fecha corrida 45 días
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq faketime > /dev/null
          faketime -f +45d pnpm --filter @campaignsuite/botmaker test
          faketime -f +45d pnpm db:probar
      - name: Pantallas con cada persona
        run: pnpm probar
      - name: Build de la app
        run: pnpm build
      - name: Navegador para la prueba del celular
        run: pnpm exec playwright install --with-deps chromium
      - name: Uso en el celular
        run: pnpm probar:celular
